---
layout: default
---

<article>

    <h1>{{ page.title | escape }}</h1>

    <p>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
    </p>

    {% include post-categories.html categories=page.categories %}

    <hr>

    {{ content }}

    <hr>

    <p>
        <a href="{{ '/' | relative_url }}">
            ← Back to home
        </a>
    </p>

</article>
