<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if page.title %}
            {{ page.title }} | {{ site.title }}
        {% else %}
            {{ site.title }}
        {% endif %}
    </title>

    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- MathJax -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>

<body>

    <header class="site-banner">
        <div class="banner-content">
            <h1>Dongjae Han</h1>
            <p>Physics · Research · Programming</p>
        </div>
    </header>

    <div class="page-layout">

        <aside class="sidebar">

            <section class="profile">
                <h2>Dongjae Han</h2>
                <p>
                    M.S. student in Physics.
                </p>
                <p>
                    Interested in strongly correlated systems,
                    nonequilibrium physics, and numerical methods.
                </p>
            </section>

            <section class="sidebar-section">
                <h3>Categories</h3>

                <ul class="sidebar-menu">
                    <li>
                        <a href="{{ '/' | relative_url }}">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="{{ '/categories/research/' | relative_url }}">
                            Research
                        </a>
                    </li>

                    <li>
                        <a href="{{ '/categories/physics/' | relative_url }}">
                            Physics Notes
                        </a>
                    </li>

                    <li>
                        <a href="{{ '/categories/programming/' | relative_url }}">
                            Programming
                        </a>
                    </li>

                    <li>
                        <a href="{{ '/categories/miscellaneous/' | relative_url }}">
                            Miscellaneous
                        </a>
                    </li>
                </ul>
            </section>

        </aside>

        <main class="main-content">
            {{ content }}
        </main>

    </div>

</body>

</html>
